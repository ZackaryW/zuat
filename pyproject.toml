[project]
name = "zuat"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ZackaryW", email = "gitzackw@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "gitpython>=3.1.45",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
cli = ["click>=8.1.8"]

[dependency-groups]
dev = [
    "behave>=1.3.3",
    "pytest>=9.0.0",
]

[project.scripts]
zuat = "zuat:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
